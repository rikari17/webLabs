<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Список пользователей JSONPlaceholder">
  <title>JSONPlaceholder Users</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Пользователи</h1>

    <div class="controls">
      <button id="loadBtn" type="button">Загрузить пользователей</button>
    </div>

    <div id="loader" class="hidden" role="status" aria-live="polite">
      Загрузка...
    </div>

    <div id="error" class="hidden" role="alert" aria-live="assertive"></div>

    <section id="userList" aria-live="polite"></section>
  </main>
  <script src="script.js"></script>
</body>
</html>
